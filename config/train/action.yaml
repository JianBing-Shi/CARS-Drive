# Continue the existing two-layer action weights for 12 additional epochs.
# This is a new optimization stage; ordinary interruption recovery uses
# its own last.ckpt with reset_training_state: false.
univeral_config: &univeral_config
  mode: "action"
  history_features: 20
  future_action: 10

datamodule:
  <<: *univeral_config
  root: ../datasets/nuplan/nuplan-v1.1
  dir: mini
  train_batch_size: 2
  val_batch_size: 2
  shuffle: true
  num_workers: 10
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  ratio: 0.1

model:
  <<: *univeral_config
  feature_dim: 256
  hidden_dim: 256
  spatial_grid: [9, 9]
  macro_grid: [3, 3]
  heads: 8
  layers: 4
  dropout: 0.1
  architecture_version: 2
  refresh_version: 2
  decoder_layers: 2
  teacher_forcing_ratio: 0.0
  action_loss: l1
  xy_loss_weight: 0.50
  yaw_weight: 0.10
  trajectory_loss_weight: 0.35
  heading_loss_weight: 0.05
  learning_rate: 0.00001
  weight_decay: 0.0001
  warmup_epochs: 1
  T_max: 12
  anchor_dropout: 0.2

trainer:
  ckpt_path: lightning_logs/action_v2_gate2/version_1/checkpoints/best.ckpt
  reset_training_state: true
  strategy: auto
  accelerator: gpu
  devices: 1
  max_epochs: 12
  gradient_clip_val: 1.0
  ckpt:
    monitor: val/ade
    save_top_k: 1
    filename: best
    mode: min
    save_last: true
  lr_monitor:
    logging_interval: epoch
  csv_logger:
    save_dir: lightning_logs
    name: action_v2_gate2_extend12
