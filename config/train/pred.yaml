# New 40-epoch action run. Set ckpt_path to this run's last.ckpt to resume.
univeral_config: &univeral_config
  mode: "pred"
  history_step: 20
  future_step: 10

datamodule:
  <<: *univeral_config
  root: /root/rivermind-data/nuplan/nuplan-v1.1
  dir: mini
  train_batch_size: 100
  val_batch_size: 100
  shuffle: true
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  ratio: 0.1

model:
  <<: *univeral_config
  feature_dim: 256
  hidden_dim: 256
  spatial_grid: [9, 9]
  macro_grid: [3, 3]
  heads: 8
  layers: 4
  dropout: 0.1
  architecture_version: 2
  refresh_version: 3
  decoder_layers: 2
  teacher_forcing_ratio: 0.0
  action_loss: l1
  xy_loss_weight: 0.50
  yaw_weight: 0.10
  trajectory_loss_weight: 0.35
  heading_loss_weight: 0.05
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 4
  T_max: 32
  lr_min_ratio: 0.05
  anchor_dropout: 0.2

trainer:
  ckpt_path: null
  strategy: auto
  accelerator: gpu
  devices: 1
  max_epochs: 32
  gradient_clip_val: 1.0
  ckpt:
    monitor: val/ade
    save_top_k: 1
    filename: best
    mode: min
    save_last: true
  lr_monitor:
    logging_interval: epoch
  csv_logger:
    save_dir: lightning_logs
    name: action_encoder
