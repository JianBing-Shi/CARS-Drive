# CARS plan1 ten-by-ten rolling validation and report export.
mode: plan1

datamodule:
  root: ../datasets/nuplan/nuplan-v1.1
  dir: mini
  mode: plan1
  history_step: 20
  future_step: 10
  val_batch_size: 2
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  ratio: 0.1

trainer:
  ckpt_path: lightning_logs/cars_plan1/version_0/checkpoints/best.ckpt
  accelerator: auto
  devices: 1
  logger: false
  enable_checkpointing: false
  enable_model_summary: false

evaluation:
  output_dir: evaluation/cars_plan1
  max_samples: null
