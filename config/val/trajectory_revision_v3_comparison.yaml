# All policies share the original action_v2_gate2 best frozen in this checkpoint.
datamodule:
  root: ../datasets/nuplan/nuplan-v1.1
  dir: mini
  mode: plan
  history_step: 20
  future_step: 10
  val_batch_size: 2
  num_workers: 0
  pin_memory: false
  persistent_workers: false

trainer:
  ckpt_path: lightning_logs/trajectory_revision_v3/version_0/checkpoints/best.ckpt
  accelerator: cpu
  devices: 1
  logger: false
  enable_checkpointing: false
  enable_model_summary: false
  enable_progress_bar: false

evaluation:
  output_dir: evaluation/trajectory_revision_v3_comparison
  samples_per_event: null
  scratch_dir: /tmp/fresh_latest_validation_cache
