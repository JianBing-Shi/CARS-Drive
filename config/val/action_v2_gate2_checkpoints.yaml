# Paired action evaluation: causal replay, fixed five-step candidate and baseline.
datamodule:
  root: ../datasets/nuplan/nuplan-v1.1
  dir: mini
  mode: action
  history_features: 20
  future_action: 10
  val_batch_size: 2
  num_workers: 0
  pin_memory: false
  persistent_workers: false

checkpoints:
  - lightning_logs/action_v2_gate2/version_1/checkpoints/best.ckpt

trainer:
  accelerator: auto
  devices: 1
  logger: false
  enable_checkpointing: false
  enable_model_summary: false
  enable_progress_bar: false

evaluation:
  output_dir: evaluation/action_v2_gate2
  max_samples: null
  scratch_dir: /tmp/fresh_action_v2_gate2_cache
