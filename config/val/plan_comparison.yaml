# Same frozen action predictor and revision adapter, paired adoption policies.
datamodule:
  root: ../datasets/nuplan/nuplan-v1.1
  dir: mini
  mode: plan
  history_step: 20
  future_step: 10
  val_batch_size: 2
  num_workers: 0
  pin_memory: false
  persistent_workers: false
trainer:
  ckpt_path: null  # Set the trained trajectory revision v3 checkpoint.
  accelerator: auto
  devices: 1
  logger: false
  enable_checkpointing: false
  enable_model_summary: false
  enable_progress_bar: false
evaluation:
  output_dir: evaluation/trajectory_revision_v3_comparison
  samples_per_event: null  # null evaluates all unique refresh validation anchors.
  scratch_dir: /tmp/fresh_refresh_comparison_cache  # null reads source BEVs directly.
