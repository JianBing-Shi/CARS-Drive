# Same frozen action predictor and revision adapter, paired adoption policies.
datamodule:
  root: ../datasets/nuplan/nuplan-v1.1
  dir: mini
  mode: plan2
  history_step: 20
  future_step: 10
  val_batch_size: 2
  num_workers: 0
  pin_memory: false
  persistent_workers: false
trainer:
  ckpt_path: lightning_logs/cars_plan2/version_0/checkpoints/best.ckpt
  accelerator: auto
  devices: 1
  logger: false
  enable_checkpointing: false
  enable_model_summary: false
  enable_progress_bar: false
evaluation:
  output_dir: evaluation/cars_plan2_comparison
  samples_per_event: null  # null evaluates all unique refresh validation anchors.
  scratch_dir: /tmp/cars_plan2_comparison_cache  # null reads source BEVs directly.
