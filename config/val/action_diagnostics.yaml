# Paired, event-stratified checkpoint diagnostics. null evaluates all unique anchors.
datamodule:
  root: ../datasets/nuplan/nuplan-v1.1
  dir: mini
  mode: action
  history_features: 20
  future_action: 10
  val_batch_size: 2
  num_workers: 0
  pin_memory: false
  persistent_workers: false
trainer:
  ckpt_path: lightning_logs/action/version_0/checkpoints/epoch=19-step=3540.ckpt
  accelerator: auto
  devices: 1
  logger: false
  enable_checkpointing: false
  enable_model_summary: false
  enable_progress_bar: false
evaluation:
  output_dir: evaluation/action_diagnostics
  samples_per_event: 2
  stale_steps: [1, 2, 4, 8, 10]
  scratch_dir: /tmp/fresh_action_diagnostics_cache  # null reads original BEVs directly.
